name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main

      - uses: aws-actions/configure-aws-credentials@main
        with:
          role-to-assume: arn:aws:iam::095713295894:role/deployment_role
          aws-region: us-west-2

      - run: aws sts get-caller-identity
